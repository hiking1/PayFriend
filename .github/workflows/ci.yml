name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payfriend
          POSTGRES_PASSWORD: payfriend_dev
          POSTGRES_DB: payfriend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payfriend"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/payfriend
      TEST_DB_USER: payfriend
      TEST_DB_PASSWORD: payfriend_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Test backend
        run: gradle test --no-daemon
      - name: Build fat jar
        run: gradle buildFatJar --no-daemon

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests and debug build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: merchant-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Switch to `npm ci` once package-lock.json is committed.
      - run: npm install
      - run: npm run build
