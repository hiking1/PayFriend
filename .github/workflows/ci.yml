name: CI

on:
  push:
    branches: [main,master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Test backend
        run: gradle test --no-daemon
      - name: Build fat jar
        run: gradle buildFatJar --no-daemon

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests and debug build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: merchant-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Switch to `npm ci` once package-lock.json is committed.
      - run: npm install
      - run: npm run build
