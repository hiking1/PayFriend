ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.payfriend.ApplicationKt.module ]
    }
}

payfriend {
    jwt {
        # DEMO DEFAULT. Always override via JWT_SECRET outside local development.
        secret = "dev-only-secret-change-me-before-any-real-use"
        secret = ${?JWT_SECRET}
        issuer = "payfriend"
        audience = "payfriend-app"
    }
    db {
        # Empty url => in-memory repository (data is lost on restart).
        url = ""
        url = ${?DB_URL}
        user = "payfriend"
        user = ${?DB_USER}
        password = ""
        password = ${?DB_PASSWORD}
    }
}
